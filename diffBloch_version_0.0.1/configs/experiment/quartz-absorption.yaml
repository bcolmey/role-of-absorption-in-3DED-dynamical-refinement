# Quartz, with absorption: forward-only inference.
# Run with:  infer quartz-absorption
# ${hydra:runtime.cwd} is the diffBloch_version_0.0.1/ directory, ${repo_root} the repository root.
# Parameters follow the supporting-information table of the paper.

atoms:
  data:
    cif_file_path: ${hydra:runtime.cwd}/data/quartz/experimental_paper_files/enantiomer_1.cif

refinement:
  inference_only: true
  dataloader:
    ignore_orientations: []
    rotation_integration_method: sequential
    batch_size: 99
    num_rotations: 99
  data:
    pets_path: ${hydra:runtime.cwd}/data/quartz/quartz.cif_pets
    integration_semiangle: 1
    rocking_curve_sampling: 42
    dsg: 0.0015
    rsg: 0.9

bloch:
  optim_thicknesses_path: null
  optim_orientations_path: ${hydra:runtime.cwd}/data/quartz/optim_orientation_abs.csv
  g_max: 2.5 # beam cutoff (1/A); the structure-factor table extends to 2 * g_max + 0.5
  g_max_refine: 1.6
  sg_max: 0.01

structure_factor:
  absorption: true

thicknessNN:
  activate: false # the network is never evaluated; its exported curve is used below

inference:
  name: quartz-absorption
  thickness_curve: ${repo_root}/absorption_paper_source_data/refinement_results/quartz_abs/thickness.csv # per-orientation thickness; null = flat
  thickness: 820 # flat thickness in Angstrom, used when thickness_curve is null
  rotations: null # null = every orientation, or a list, e.g. [0,1,2]
  output_dir: ${repo_root}/inference_outputs/quartz-absorption
